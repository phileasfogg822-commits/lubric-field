name: Phase 12 Segmented Verification

# CI execution is delegated to CircleCI. Manual-only GitHub workflow.
on:
  workflow_dispatch:

jobs:
  segment:
    name: "${{ matrix.id }} — ${{ matrix.label }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "12.1.1"
            label: "Operational repository contract"
            test: "*OperationalBusinessRepositoryContractTest"
          - id: "12.1.2"
            label: "Room offline read-write integration"
            test: "*OperationalBusinessRoomIntegrationTest"
          - id: "12.2.1"
            label: "Room incoming and rollback regression"
            test: "*OperationalBusinessRoomIntegrationTest"
          - id: "12.2.2"
            label: "Persistent business context"
            test: "*PersistentBusinessContextServiceTest"
          - id: "12.2.3"
            label: "Local-versus-remote conflict regression"
            test: "*OperationalBusinessRoomIntegrationTest.incomingRemoteChangeCannotOverwritePendingLocalEdit"
          - id: "12.2.4"
            label: "Cursor replay and monotonicity"
            test: "*OperationalBusinessRoomIntegrationTest.repeatedIncomingBatchIsIdempotentAndCursorNeverRegresses"
          - id: "12.4.3"
            label: "Cross-tenant and cross-business isolation"
            test: "*OperationalBusinessRoomIntegrationTest.operationalTablesRemainIsolatedAcrossTenantsAndBusinesses"
          - id: "12.2.5"
            label: "Persisted retry and restart recovery"
            test: "*OperationalBusinessRoomIntegrationTest.failedUploadPersistsRetryStateAcrossRestart"
          - id: "12.1.5a"
            label: "Items ViewModel scoped repository behavior"
            module: ":feature:items"
            test: "*ItemsViewModelTest"
          - id: "12.1.5b"
            label: "Inventory ViewModel scoped repository behavior"
            module: ":feature:inventory"
            test: "*InventoryViewModelTest"
          - id: "12.1.5c"
            label: "Parties ViewModel scoped repository behavior"
            module: ":feature:parties"
            test: "*PartiesViewModelTest"
          - id: "12.1.5d"
            label: "Sales ViewModel scoped repository behavior"
            module: ":feature:sales"
            test: "*SalesViewModelTest"
          - id: "12.1.5e"
            label: "Purchases ViewModel scoped repository behavior"
            module: ":feature:purchases"
            test: "*PurchasesViewModelTest"
          - id: "12.1.5f"
            label: "Accounts ViewModel scoped repository behavior"
            module: ":feature:accounts"
            test: "*AccountsViewModelTest"
          - id: "12.2.6"
            label: "Network timeout and receipt safety"
            module: ":core:sync"
            test: "*SyncEngineTest"
          - id: "12.4.5a"
            label: "Cloud consent opt-out and tenant isolation"
            test: "*CloudSyncConsentTest"
          - id: "12.4.1"
            label: "Device identity persistence"
            test: "*PersistentDeviceIdentityProviderTest"
          - id: "12.4.2"
            label: "Tenant access-control repository"
            test: "*RoomAccessControlRepositoryTest"
          - id: "12.6.1"
            label: "Room repository data sources"
            test: "*RoomRepositoryDataSourcesTest"
          - id: "12.6.2"
            label: "Business setup repository"
            test: "*RoomBusinessSetupRepositoryTest"
    defaults:
      run:
        working-directory: android
    steps:
      - name: "00.1 Checkout"
        uses: actions/checkout@v4
      - name: "00.2 Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: "00.3 Android SDK"
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: "00.4 Gradle setup"
        uses: gradle/actions/setup-gradle@v4
      - name: "00.5 Gradle executable"
        run: chmod +x gradlew
      - name: "${{ matrix.id }} Execute focused regression"
        run: ./gradlew ${{ matrix.module || ':core:store' }}:testDebugUnitTest --tests "${{ matrix.test }}" --stacktrace --no-daemon
      - name: "${{ matrix.id }} Publish result summary"
        if: always()
        shell: bash
        run: |
          echo "## ${{ matrix.id }} — ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Focused test: \`${{ matrix.test }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
