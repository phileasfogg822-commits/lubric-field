name: Native Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests and debug APK
        run: ./gradlew clean test :app:assembleDebug --no-daemon
