name: Native Android CI

concurrency:
  group: native-android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Enforce repository boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --fixed-strings 'project(":core:store")' feature/*/build.gradle.kts; then
            echo "Feature modules must depend on :core:repository, not :core:store."
            exit 1
          fi

          if grep -R --line-number --fixed-strings 'project(":core:network")' feature/*/build.gradle.kts; then
            echo "Feature modules must not depend directly on :core:network."
            exit 1
          fi

          if grep -R --line-number -E 'import androidx\.room\.|import retrofit2\.' feature/*/src 2>/dev/null; then
            echo "Feature source must not import Room or Retrofit directly."
            exit 1
          fi

          if grep -R --line-number -E 'import android\.|import androidx\.|import dagger\.|import retrofit2\.' core/repository/src/main 2>/dev/null; then
            echo ":core:repository must remain pure JVM."
            exit 1
          fi

      - name: Enforce white-label boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number -E '"LubrcApp"|api\.lubrcapp\.com' whitelist/config/src core/network/src 2>/dev/null; then
            echo "Brand identity or endpoint must come from deployment configuration, not Kotlin source."
            exit 1
          fi

          if grep -R --line-number -E 'android\.content\.Context|DataStore|CacheService' whitelist/config/src/main 2>/dev/null; then
            echo "White-label configuration engine must not depend on Context/cache/DataStore."
            exit 1
          fi

      - name: Enforce design-system boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number -E '6200EE|03DAC6|B00020' core/designsystem/src/main 2>/dev/null; then
            echo "Design-system source must consume runtime brand colors, not legacy brand constants."
            exit 1
          fi

          if grep -R --line-number -E 'absoluteOffset|padding\([^)]*(left|right)[[:space:]]*=' core/designsystem/src/main core/ui/src/main 2>/dev/null; then
            echo "Shared UI must use RTL-safe start/end layout semantics."
            exit 1
          fi

      - name: Enforce authentication boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --fixed-strings 'HttpLoggingInterceptor.Level.BODY' core/network/src 2>/dev/null; then
            echo "HTTP body logging is forbidden because authentication payloads may contain credentials."
            exit 1
          fi

          if grep -R --line-number -E 'android\.content\.Context|SharedPreferences|DataStore' feature/auth/src/main 2>/dev/null; then
            echo "Auth feature code must use core:auth contracts, not direct Android storage/context."
            exit 1
          fi

          if grep -R --line-number -E 'accessToken|refreshToken' feature/auth/src/main 2>/dev/null; then
            echo "Auth feature/UI code must not handle token material directly."
            exit 1
          fi

      - name: Enforce business-creation boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -n -E 'retrofit|okhttp|core\.network' core/store/src/main/java/com/lubrcapp/lubrcapp/core/store/repository/RoomBusinessSetupRepository.kt 2>/dev/null; then
            echo "Initial business creation must remain local/offline and must not depend on network code."
            exit 1
          fi

          if grep -n -E 'val (countryCode|currencyCode): String = "[A-Z]+' feature/auth/src/main/java/com/lubrcapp/lubrcapp/feature/auth/BusinessSetupViewModel.kt 2>/dev/null; then
            echo "First-run business setup must not hard-code a default country or currency."
            exit 1
          fi

          if ! grep -q 'transactionRunner.run' core/store/src/main/java/com/lubrcapp/lubrcapp/core/store/repository/RoomBusinessSetupRepository.kt; then
            echo "Initial business creation must remain atomic in a Room transaction."
            exit 1
          fi

      - name: Enforce tenant isolation boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --fixed-strings 'whitelist:tenant' app/build.gradle.kts settings.gradle.kts feature/*/build.gradle.kts 2>/dev/null; then
            echo "Tenant/business context belongs to core repository/store layers, not the legacy white-label tenant module."
            exit 1
          fi

          if grep -R --line-number -E 'hasRole\(|isOwnerOrAdmin\(|getUserRoles\(' core/repository/src/main feature/dashboard/src/main 2>/dev/null; then
            echo "Phase 9 business selection must not use role-name shortcuts; permissions are a later capability layer."
            exit 1
          fi

          if ! grep -q 'getActiveById' core/store/src/main/java/com/lubrcapp/lubrcapp/core/store/repository/PersistentBusinessContextService.kt; then
            echo "Business switching must validate the active business under the supplied tenant."
            exit 1
          fi

          if ! grep -q 'getMembership' core/store/src/main/java/com/lubrcapp/lubrcapp/core/store/repository/PersistentBusinessContextService.kt; then
            echo "Business switching must validate user membership before changing current context."
            exit 1
          fi

          if grep -R --line-number -E 'SharedPreferences|DataStore' feature/dashboard/src/main 2>/dev/null; then
            echo "Dashboard must consume tenant-context contracts and must not persist current business directly."
            exit 1
          fi

      - name: Enforce platform and capability boundaries
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q 'compileSdk = 36' app/build.gradle.kts || ! grep -q 'targetSdk = 36' app/build.gradle.kts; then
            echo "Phase 10 requires compileSdk/targetSdk 36."
            exit 1
          fi

          if grep -R --line-number 'kotlinCompilerExtensionVersion' --include='build.gradle.kts' . 2>/dev/null; then
            echo "Kotlin 2 Compose modules must use org.jetbrains.kotlin.plugin.compose."
            exit 1
          fi

          if grep -R --line-number -E 'hasRole\(|isOwnerOrAdmin\(|role\.name[[:space:]]*==|roleName[[:space:]]*==' core feature app 2>/dev/null; then
            echo "Business authorization must use capability keys, never role-name checks."
            exit 1
          fi

          if grep -R --line-number -E 'import .*\.core\.store\.db\.dao\.' feature/*/src/main 2>/dev/null; then
            echo "Feature modules must not access authorization DAOs directly."
            exit 1
          fi

          if grep -R --line-number -E 'Text\("[^"]+' feature/*/src/main core/ui/src/main app/src/main 2>/dev/null; then
            echo "Visible Compose text must come from localized resources or runtime configuration."
            exit 1
          fi

          if ! grep -q 'Capabilities.ROLES_MANAGE' core/repository/src/main/kotlin/com/lubrcapp/lubrcapp/core/repository/usecase/AccessControlUseCases.kt; then
            echo "Access-control mutations must remain capability protected."
            exit 1
          fi

      - name: Enforce audit and security policy
        shell: bash
        run: |
          set -euo pipefail

          AUDIT_DAO="core/store/src/main/java/com/lubrcapp/lubrcapp/core/store/db/dao/FoundationDaos.kt"
          ACCESS_REPO="core/store/src/main/java/com/lubrcapp/lubrcapp/core/store/repository/RoomAccessControlRepository.kt"
          AUDIT_POLICY="core/repository/src/main/kotlin/com/lubrcapp/lubrcapp/core/repository/AuditPolicy.kt"

          if sed -n '/interface AuditDao/,/interface ActivityDao/p' "$AUDIT_DAO" | grep -E 'UPDATE[[:space:]]+audit_logs|DELETE[[:space:]]+FROM[[:space:]]+audit_logs'; then
            echo "Audit logs must remain append-only: AuditDao may not update or delete audit rows."
            exit 1
          fi

          if ! grep -q 'auditDao.insert' "$ACCESS_REPO"; then
            echo "Privileged access-control mutations must emit audit records."
            exit 1
          fi

          if ! grep -q 'Capabilities.AUDIT_VIEW' "$AUDIT_POLICY"; then
            echo "Audit history must remain protected by the audit.view capability."
            exit 1
          fi

          if grep -E -i 'password|refreshToken|accessToken|otp|pin' "$ACCESS_REPO" | grep -E 'beforeJson|afterJson|securityJson|recordAudit'; then
            echo "Credential material must never be written into audit payloads."
            exit 1
          fi

          if grep -R --line-number -E 'AuditRepository' feature/*/src/main 2>/dev/null; then
            echo "Feature code must consume capability-gated audit use cases, not AuditRepository directly."
            exit 1
          fi

          if ! grep -q 'WindowManager.LayoutParams.FLAG_SECURE' app/src/main/java/com/lubrcapp/lubrcapp/MainActivity.kt; then
            echo "Screenshot policy must be enforced at the Android window boundary."
            exit 1
          fi

          if ! grep -q 'lockOnBackground' app/src/main/java/com/lubrcapp/lubrcapp/MainActivity.kt; then
            echo "The app-lock background policy must be enforced by the activity lifecycle."
            exit 1
          fi

          if ! grep -q 'Capabilities.SETTINGS_MANAGE' feature/settings/src/main/java/com/lubrcapp/lubrcapp/feature/settings/AccessControlViewModel.kt; then
            echo "Security policy changes must remain capability gated."
            exit 1
          fi

          if grep -R --line-number -E 'Log\.[a-zA-Z]+\([^\n]*(password|accessToken|refreshToken|otp|pin)' core app feature 2>/dev/null; then
            echo "Secrets or authentication material must never be written to application logs."
            exit 1
          fi

          HISTORY_POLICY="core/repository/src/main/kotlin/com/lubrcapp/lubrcapp/core/repository/HistoryMutationPolicy.kt"
          if ! grep -q 'HistoryMutation.DIRECT_EDIT' "$HISTORY_POLICY" || ! grep -q 'HistoryMutation.DIRECT_DELETE' "$HISTORY_POLICY"; then
            echo "Protected history policy must explicitly reject direct edit and delete."
            exit 1
          fi

          if ! grep -q 'reason.isNullOrBlank' "$HISTORY_POLICY"; then
            echo "Reversals and corrections must require a reason."
            exit 1
          fi

      - name: "15.1 Room incoming sync and rollback regression"
        run: ./gradlew :core:store:testDebugUnitTest --tests "*OperationalBusinessRoomIntegrationTest" --stacktrace --no-daemon

      - name: "15.2 Full Room store unit tests"
        run: ./gradlew :core:store:testDebugUnitTest --stacktrace --no-daemon

      - name: "15.3 All Android unit tests"
        run: ./gradlew test --stacktrace --no-daemon

      - name: "15.4 Android lint"
        run: ./gradlew lint --stacktrace --no-daemon

      - name: "15.5 Debug APK"
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: "15.6 Release APK"
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: "16. Room migration instrumentation-test compilation"
        run: ./gradlew :core:store:assembleDebugAndroidTest --no-daemon

      - name: "17. Alternate white-label APK build"
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -Pwl.appName="ABC Pharmacy" \
            -Pwl.applicationId=com.example.abcpharmacy \
            -Pwl.apiEndpoint=https://pharmacy.example.invalid/ \
            -Pwl.includedModules=inventory,barcodes,batch_tracking \
            -Pwl.term.item=Medicine \
            -Pwl.term.customer=Patient \
            -Pwl.brand.primaryColor=FF00695C \
            -Pwl.brand.cardStyle=outlined \
            -Pwl.brand.buttonStyle=flat \
            -Pwl.brand.borderRadius=24 \
            -Pwl.design.defaultTextScale=1.20 \
            -Pwl.design.defaultLargeTouchTargets=true \
            -Pwl.paymentMethods=cash:Cash,insurance:Insurance

      - name: "18. Inspect and record APK artifact evidence"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          find app/build/outputs/apk -type f -name '*.apk' -print | sort | tee acceptance-evidence/apk-files.txt
          test -s acceptance-evidence/apk-files.txt
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          while IFS= read -r apk; do
            test -s "$apk"
            sha256sum "$apk" >> acceptance-evidence/apk-sha256.txt
          done < acceptance-evidence/apk-files.txt
          cat acceptance-evidence/apk-sha256.txt
          echo "Verified APK paths and SHA-256 hashes for commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: "19. Upload APK and acceptance evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-and-acceptance-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/acceptance-evidence/**
            android/**/build/test-results/**/*.xml
            android/**/build/reports/lint-results*.html
          if-no-files-found: warn
          retention-days: 14
