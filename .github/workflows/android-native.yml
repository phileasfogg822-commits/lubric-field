name: Native Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Enforce repository boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --fixed-strings 'project(":core:store")' feature/*/build.gradle.kts; then
            echo "Feature modules must depend on :core:repository, not :core:store."
            exit 1
          fi

          if grep -R --line-number --fixed-strings 'project(":core:network")' feature/*/build.gradle.kts; then
            echo "Feature modules must not depend directly on :core:network."
            exit 1
          fi

          if grep -R --line-number -E 'import androidx\.room\.|import retrofit2\.' feature/*/src 2>/dev/null; then
            echo "Feature source must not import Room or Retrofit directly."
            exit 1
          fi

          if grep -R --line-number -E 'import android\.|import androidx\.|import dagger\.|import retrofit2\.' core/repository/src/main 2>/dev/null; then
            echo ":core:repository must remain pure JVM."
            exit 1
          fi

      - name: Enforce white-label boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number -E '"LubrcApp"|api\.lubrcapp\.com' whitelist/config/src core/network/src 2>/dev/null; then
            echo "Brand identity or endpoint must come from deployment configuration, not Kotlin source."
            exit 1
          fi

          if grep -R --line-number -E 'android\.content\.Context|DataStore|CacheService' whitelist/config/src/main 2>/dev/null; then
            echo "White-label configuration engine must not depend on Context/cache/DataStore."
            exit 1
          fi

      - name: Enforce design-system boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number -E '6200EE|03DAC6|B00020' core/designsystem/src/main 2>/dev/null; then
            echo "Design-system source must consume runtime brand colors, not legacy brand constants."
            exit 1
          fi

          if grep -R --line-number -E 'absoluteOffset|padding\([^)]*(left|right)[[:space:]]*=' core/designsystem/src/main core/ui/src/main 2>/dev/null; then
            echo "Shared UI must use RTL-safe start/end layout semantics."
            exit 1
          fi

      - name: Enforce authentication boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --fixed-strings 'HttpLoggingInterceptor.Level.BODY' core/network/src 2>/dev/null; then
            echo "HTTP body logging is forbidden because authentication payloads may contain credentials."
            exit 1
          fi

          if grep -R --line-number -E 'android\.content\.Context|SharedPreferences|DataStore' feature/auth/src/main 2>/dev/null; then
            echo "Auth feature code must use core:auth contracts, not direct Android storage/context."
            exit 1
          fi

          if grep -R --line-number -E 'accessToken|refreshToken' feature/auth/src/main 2>/dev/null; then
            echo "Auth feature/UI code must not handle token material directly."
            exit 1
          fi

      - name: Unit tests and debug APK
        run: ./gradlew clean test :app:assembleDebug --no-daemon

      - name: Compile Room migration instrumentation tests
        run: ./gradlew :core:store:assembleDebugAndroidTest --no-daemon

      - name: Build alternate white-label deployment
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -Pwl.appName="ABC Pharmacy" \
            -Pwl.applicationId=com.example.abcpharmacy \
            -Pwl.apiEndpoint=https://pharmacy.example.invalid/ \
            -Pwl.includedModules=inventory,barcodes,batch_tracking \
            -Pwl.term.item=Medicine \
            -Pwl.term.customer=Patient \
            -Pwl.brand.primaryColor=FF00695C \
            -Pwl.brand.cardStyle=outlined \
            -Pwl.brand.buttonStyle=flat \
            -Pwl.brand.borderRadius=24 \
            -Pwl.design.defaultTextScale=1.20 \
            -Pwl.design.defaultLargeTouchTargets=true \
            -Pwl.paymentMethods=cash:Cash,insurance:Insurance
