name: Native Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Enforce repository boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --fixed-strings 'project(":core:store")' feature/*/build.gradle.kts; then
            echo "Feature modules must depend on :core:repository, not :core:store."
            exit 1
          fi

          if grep -R --line-number --fixed-strings 'project(":core:network")' feature/*/build.gradle.kts; then
            echo "Feature modules must not depend directly on :core:network."
            exit 1
          fi

          if grep -R --line-number -E 'import androidx\.room\.|import retrofit2\.' feature/*/src 2>/dev/null; then
            echo "Feature source must not import Room or Retrofit directly."
            exit 1
          fi

          if grep -R --line-number -E 'import android\.|import androidx\.|import dagger\.|import retrofit2\.' core/repository/src/main 2>/dev/null; then
            echo ":core:repository must remain pure JVM."
            exit 1
          fi

      - name: Enforce white-label boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number -E '"LubrcApp"|api\.lubrcapp\.com' whitelist/config/src core/network/src 2>/dev/null; then
            echo "Brand identity or endpoint must come from deployment configuration, not Kotlin source."
            exit 1
          fi

          if grep -R --line-number -E 'android\.content\.Context|DataStore|CacheService' whitelist/config/src/main 2>/dev/null; then
            echo "White-label configuration engine must not depend on Context/cache/DataStore."
            exit 1
          fi

      - name: Enforce design-system boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number -E '6200EE|03DAC6|B00020' core/designsystem/src/main 2>/dev/null; then
            echo "Design-system source must consume runtime brand colors, not legacy brand constants."
            exit 1
          fi

          if grep -R --line-number -E 'absoluteOffset|padding\([^)]*(left|right)[[:space:]]*=' core/designsystem/src/main core/ui/src/main 2>/dev/null; then
            echo "Shared UI must use RTL-safe start/end layout semantics."
            exit 1
          fi

      - name: Enforce authentication boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --fixed-strings 'HttpLoggingInterceptor.Level.BODY' core/network/src 2>/dev/null; then
            echo "HTTP body logging is forbidden because authentication payloads may contain credentials."
            exit 1
          fi

          if grep -R --line-number -E 'android\.content\.Context|SharedPreferences|DataStore' feature/auth/src/main 2>/dev/null; then
            echo "Auth feature code must use core:auth contracts, not direct Android storage/context."
            exit 1
          fi

          if grep -R --line-number -E 'accessToken|refreshToken' feature/auth/src/main 2>/dev/null; then
            echo "Auth feature/UI code must not handle token material directly."
            exit 1
          fi

      - name: Enforce business-creation boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -n -E 'retrofit|okhttp|core\.network' core/store/src/main/java/com/lubrcapp/lubrcapp/core/store/repository/RoomBusinessSetupRepository.kt 2>/dev/null; then
            echo "Initial business creation must remain local/offline and must not depend on network code."
            exit 1
          fi

          if grep -n -E 'val (countryCode|currencyCode): String = "[A-Z]+' feature/auth/src/main/java/com/lubrcapp/lubrcapp/feature/auth/BusinessSetupViewModel.kt 2>/dev/null; then
            echo "First-run business setup must not hard-code a default country or currency."
            exit 1
          fi

          if ! grep -q 'transactionRunner.run' core/store/src/main/java/com/lubrcapp/lubrcapp/core/store/repository/RoomBusinessSetupRepository.kt; then
            echo "Initial business creation must remain atomic in a Room transaction."
            exit 1
          fi

      - name: Enforce tenant isolation boundaries
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number --fixed-strings 'whitelist:tenant' app/build.gradle.kts settings.gradle.kts feature/*/build.gradle.kts 2>/dev/null; then
            echo "Tenant/business context belongs to core repository/store layers, not the legacy white-label tenant module."
            exit 1
          fi

          if grep -R --line-number -E 'hasRole\(|isOwnerOrAdmin\(|getUserRoles\(' core/repository/src/main feature/dashboard/src/main 2>/dev/null; then
            echo "Phase 9 business selection must not use role-name shortcuts; permissions are a later capability layer."
            exit 1
          fi

          if ! grep -q 'getActiveById' core/store/src/main/java/com/lubrcapp/lubrcapp/core/store/repository/PersistentBusinessContextService.kt; then
            echo "Business switching must validate the active business under the supplied tenant."
            exit 1
          fi

          if ! grep -q 'getMembership' core/store/src/main/java/com/lubrcapp/lubrcapp/core/store/repository/PersistentBusinessContextService.kt; then
            echo "Business switching must validate user membership before changing current context."
            exit 1
          fi

          if grep -R --line-number -E 'SharedPreferences|DataStore' feature/dashboard/src/main 2>/dev/null; then
            echo "Dashboard must consume tenant-context contracts and must not persist current business directly."
            exit 1
          fi

      - name: Unit tests lint debug and release APKs
        run: ./gradlew clean test lint :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Compile Room migration instrumentation tests
        run: ./gradlew :core:store:assembleDebugAndroidTest --no-daemon

      - name: Build alternate white-label deployment
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -Pwl.appName="ABC Pharmacy" \
            -Pwl.applicationId=com.example.abcpharmacy \
            -Pwl.apiEndpoint=https://pharmacy.example.invalid/ \
            -Pwl.includedModules=inventory,barcodes,batch_tracking \
            -Pwl.term.item=Medicine \
            -Pwl.term.customer=Patient \
            -Pwl.brand.primaryColor=FF00695C \
            -Pwl.brand.cardStyle=outlined \
            -Pwl.brand.buttonStyle=flat \
            -Pwl.brand.borderRadius=24 \
            -Pwl.design.defaultTextScale=1.20 \
            -Pwl.design.defaultLargeTouchTargets=true \
            -Pwl.paymentMethods=cash:Cash,insurance:Insurance
