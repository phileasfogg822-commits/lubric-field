name: Phase 12 GitHub Queue Coordinator

# GitHub owns task state; CircleCI supplies the external build checks.
# IMPORTANT: schedule only runs from the default branch, and GitHub-hosted
# jobs require available runner minutes. This workflow never writes code.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write
  statuses: read

concurrency:
  group: phase12-queue-coordinator
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check CircleCI evidence and annotate the active GitHub queue issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'phase-12-completion';
            const {data: ref} = await github.rest.repos.getBranch({owner,repo,branch});
            const sha = ref.commit.sha;
            const {data: statuses} = await github.rest.repos.listCommitStatusesForRef({owner,repo,ref:sha,per_page:100});
            const required = ['ci/circleci: phase12-smoke','ci/circleci: phase12-recovery-and-security','ci/circleci: phase12-business-ui','ci/circleci: android-full-verification','ci/circleci: phase12-acceptance-gate'];
            const latest = new Map();
            for (const status of statuses) {
              if (!latest.has(status.context)) latest.set(status.context,status);
            }
            const missing = required.filter(name => latest.get(name)?.state !== 'success');
            const issueNumbers = [13,14,15,16,17,18];
            let active = null;
            for (const issue_number of issueNumbers) {
              const {data: issue} = await github.rest.issues.get({owner,repo,issue_number});
              if (issue.state === 'open') { active = issue_number; break; }
            }
            if (!active) return;
            const outcome = missing.length === 0 ? 'All configured CircleCI checks passed' : 'Waiting for checks: ' + missing.join(', ');
            const marker = '<!-- phase12-coordinator -->';
            const body = marker + '\nQueue status for `' + sha.slice(0,12) + '`: ' + outcome +
              '\nThis is CI evidence only. A coding agent must implement and verify acceptance criteria before an issue is closed.';
            const {data: comments} = await github.rest.issues.listComments({owner,repo,issue_number:active,per_page:100});
            const prior = comments.find(c => c.body?.startsWith(marker) && c.user?.type === 'Bot');
            if (prior) {
              if (prior.body !== body) await github.rest.issues.updateComment({owner,repo,comment_id:prior.id,body});
            } else {
              await github.rest.issues.createComment({owner,repo,issue_number:active,body});
            }
