# Lubric Field cloud CI. GitHub remains the source of truth.
# On Phase 12 pushes, full verification automatically follows a successful smoke job.
# Any failed job blocks dependent work; CircleCI reports status to GitHub.
version: 2.1

executors:
  android:
    docker:
      - image: cimg/android:2026.08
    resource_class: medium
    working_directory: ~/project/android
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2048m"

commands:
  prepare_android:
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Verify Android SDK and Gradle wrapper
          command: |
            set -euo pipefail
            test -f gradlew
            chmod +x gradlew
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
            test -x "$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

jobs:
  phase12-smoke:
    executor: android
    steps:
      - prepare_android
      - run:
          name: Phase 12 sync-engine regression
          command: ./gradlew :core:sync:testDebugUnitTest --tests "*SyncEngineTest" --stacktrace --no-daemon --max-workers=2
      - store_test_results:
          path: core/sync/build/test-results
      - store_artifacts:
          path: core/sync/build/reports/tests
          destination: phase12-smoke-test-report

  android-full-verification:
    executor: android
    steps:
      - prepare_android
      - run:
          name: All Android unit and Room tests
          command: ./gradlew test --stacktrace --no-daemon --max-workers=2
          no_output_timeout: 20m
      - run:
          name: Android lint
          command: ./gradlew lint --stacktrace --no-daemon --max-workers=2
          no_output_timeout: 20m
      - run:
          name: Debug and release APKs
          command: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon --max-workers=2
          no_output_timeout: 20m
      - run:
          name: Room migration instrumentation-test compilation
          command: ./gradlew :core:store:assembleDebugAndroidTest --stacktrace --no-daemon --max-workers=2
          no_output_timeout: 20m
      - run:
          name: Preserve default debug and release APKs
          command: |
            mkdir -p /tmp/lubric-default-apks
            cp -R app/build/outputs/apk/. /tmp/lubric-default-apks/
      - run:
          name: Alternate white-label APK
          command: |
            ./gradlew :app:assembleDebug --stacktrace --no-daemon --max-workers=2 \
              -Pwl.appName="ABC Pharmacy" \
              -Pwl.applicationId=com.example.abcpharmacy \
              -Pwl.apiEndpoint=https://pharmacy.example.invalid/ \
              -Pwl.includedModules=inventory,barcodes,batch_tracking \
              -Pwl.term.item=Medicine \
              -Pwl.term.customer=Patient \
              -Pwl.brand.primaryColor=FF00695C \
              -Pwl.brand.cardStyle=outlined \
              -Pwl.brand.buttonStyle=flat \
              -Pwl.brand.borderRadius=24 \
              -Pwl.design.defaultTextScale=1.20 \
              -Pwl.design.defaultLargeTouchTargets=true \
              -Pwl.paymentMethods=cash:Cash,insurance:Insurance
          no_output_timeout: 20m
      - run:
          name: Package default and white-label APKs
          command: |
            set -euo pipefail
            mkdir -p /tmp/lubric-apk-artifacts/default /tmp/lubric-apk-artifacts/white-label
            cp -R /tmp/lubric-default-apks/. /tmp/lubric-apk-artifacts/default/
            cp -R app/build/outputs/apk/. /tmp/lubric-apk-artifacts/white-label/
            find /tmp/lubric-apk-artifacts -type f -name '*.apk' -print
            test "$(find /tmp/lubric-apk-artifacts -type f -name '*.apk' | wc -l)" -ge 3
      - store_test_results:
          path: core/store/build/test-results
      - store_artifacts:
          path: /tmp/lubric-apk-artifacts
          destination: android-apks
      - store_artifacts:
          path: app/build/reports
          destination: android-reports
      - store_artifacts:
          path: core/store/build/reports/tests
          destination: room-test-reports

  phase12-recovery-and-security:
    executor: android
    steps:
      - prepare_android
      - run:
          name: Sync contract, persistence, security and consent regression
          command: |
            ./gradlew :core:sync:testDebugUnitTest :core:store:testDebugUnitTest --stacktrace --no-daemon --max-workers=2
          no_output_timeout: 20m
      - store_test_results:
          path: core/sync/build/test-results
      - store_test_results:
          path: core/store/build/test-results
      - store_artifacts:
          path: core/sync/build/reports/tests
          destination: sync-recovery-reports
      - store_artifacts:
          path: core/store/build/reports/tests
          destination: store-security-reports

  phase12-business-ui:
    executor: android
    steps:
      - prepare_android
      - run:
          name: Compile business UI and execute domain tests
          command: |
            ./gradlew :app:assembleDebug :feature:items:testDebugUnitTest :feature:inventory:testDebugUnitTest :feature:parties:testDebugUnitTest :feature:sales:testDebugUnitTest :feature:purchases:testDebugUnitTest :feature:accounts:testDebugUnitTest --stacktrace --no-daemon --max-workers=2
          no_output_timeout: 20m
      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: ui-integration-apk

  phase12-acceptance-gate:
    executor: android
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Record validated source revision
          command: |
            set -euo pipefail
            git rev-parse HEAD
            git status --short
            printf 'All required CircleCI jobs passed for %s\n' "$(git rev-parse HEAD)" > /tmp/phase12-ci-acceptance.txt
      - store_artifacts:
          path: /tmp/phase12-ci-acceptance.txt
          destination: acceptance/phase12-ci-acceptance.txt

workflows:
  phase12-large-batch:
    jobs:
      - phase12-smoke:
          filters:
            branches:
              only: phase-12-completion
      - phase12-recovery-and-security:
          requires:
            - phase12-smoke
      - phase12-business-ui:
          requires:
            - phase12-smoke
      - android-full-verification:
          requires:
            - phase12-smoke
      - phase12-acceptance-gate:
          requires:
            - phase12-recovery-and-security
            - phase12-business-ui
            - android-full-verification
